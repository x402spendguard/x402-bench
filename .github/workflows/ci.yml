name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # These steps mirror `npm run verify` (see package.json / CONTRIBUTING.md) plus a built-bin smoke —
  # keep them in sync so a green local `verify` means a green CI. Kept granular so a failure annotates
  # the exact step in the GitHub UI.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The bin is a shipped artifact. Guard that `--help` prints usage and EXITS — it once silently
      # started the server and hung. `timeout` fails the job if it ever hangs again (bash pipefail is
      # on by default in Actions, so a killed `node` fails the step); grep proves the usage text.
      # Block scalar + a colon-free grep pattern (a `: ` in a plain YAML scalar is a mapping separator).
      - name: bin smoke — --help prints usage and exits
        run: |
          timeout 15 node dist/cli.js --help | grep -q "npx x402-bench"
